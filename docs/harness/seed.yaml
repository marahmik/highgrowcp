version: 2
status: approved
task_id: 20260729-234210-069d
goal: "전체 관리자가 퇴사자 목록에서 대상자를 선택해 해당 매장의 과거 근무기록을 월별·조회 전용으로 확인한다."
constraints:
  - "기존 React Router, Supabase, MobileScheduleGrid 패턴을 재사용한다."
  - "근무기록 수정 기능과 데이터베이스 변경을 추가하지 않는다."
  - "상세 UI 라우트는 기존 매장 관리자 허용 경계와 분리된 profiles.role='admin' 전용 보호 조건을 사용한다."
  - "기존 RLS의 매장 관리자 데이터 조회 범위는 이번 UI 기능의 변경 대상이 아니다."
acceptance_criteria:
  - "AC1: 퇴사자 목록의 각 카드에만 근무기록 버튼이 보인다."
  - "AC2: 버튼은 선택한 store_members.id를 가진 전체 관리자 전용 페이지로 이동한다."
  - "AC3: 상세 페이지는 해당 멤버십이 role='resigned'인지 확인하고, 선택 월 스케줄에 그 행의 user_id와 store_id를 모두 적용한다."
  - "AC4: 상세 페이지 일정표는 항상 조회 전용이다."
  - "AC5: 기록이 없는 달은 빈 일정표와 0일 합계를 표시한다."
  - "AC6: 존재하지 않거나 퇴사자가 아닌 멤버십은 스케줄을 표시하지 않고 명확한 오류 상태를 표시한다."
  - "AC7: 상세 라우트는 profiles.role='admin'이 아니면 자식을 마운트하지 않고 /my로 이동시킨다."
out_of_scope:
  - "여러 매장의 근무기록 통합"
  - "매장 관리자 접근 허용"
  - "퇴사 처리 방식 변경"
assumptions:
  - "원격 public.store_members에는 role='resigned'와 nullable resignation_date가 존재한다. 2026-07-29 Supabase 스키마 조회로 확인했다."
risks:
  - "동일 사용자의 다른 매장 기록이 섞일 수 있으므로 store_id와 user_id를 함께 필터링해야 한다."
  - "잘못된 멤버십, 퇴사자가 아닌 멤버십, 기록 없는 달을 별도로 처리해야 한다."
  - "빠른 월 이동에서 이전 요청 응답이 최종 선택 월의 상태를 덮어쓰지 않아야 한다."
  - "저장소에 자동 테스트 인프라가 없어 사용자가 수동 E2E 예외를 승인했다."
references:
  - "docs/harness/kickoff-summary.md"
  - "docs/brainstorming/scratchboard.md"
  - "src/pages/admin/MembersTab.tsx"
  - "src/pages/HistoryPage.tsx"
  - "src/App.tsx"
